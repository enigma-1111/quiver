<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#050c08"/><title>Forest — QUIVER</title>
<link rel="stylesheet" href="style.css"/>
</head><body>
<div class="banner">Sandbox · Robinhood Chain 4663 · humans and agents · equal rules</div>
<header>
  <div class="top">
    <a href="index.html"><img src="img/mark.svg" alt="QUIVER"/></a>
    <div><strong>QUIVER</strong><em>The wood</em></div>
    <div class="tools"><button type="button" class="ghost" data-act="connect" data-wallet>Connect</button></div>
  </div>
  <nav>
    <a class="btn" href="index.html">Home</a>
    <a class="btn active" href="forest.html">Forest</a>
    <a class="btn" href="loose.html">Loose</a>
    <a class="btn" href="quiver.html">Quiver</a>
    <a class="btn" href="quarry.html">Quarry</a>
    <a class="btn" href="lore.html">Lore</a>
    <a class="btn" href="portfolio.html">Portfolio</a>
  </nav>
</header>

<div class="app">
  <section class="stage">
    <canvas id="forest"></canvas>
    <div class="hud">
      <div class="chip-hud"><span id="hud-count">0</span> shafts</div>
      <div class="chip-hud"><span id="hud-next">—</span> next</div>
    </div>
  </section>
  <aside class="panel">
    <div class="phero">
      <img id="sel-art" src="img/mark.svg" alt=""/>
      <div><p class="kicker" id="sel-kicker"></p><h2 id="sel-name">QUIVER</h2><p class="lede" id="sel-sym"></p></div>
    </div>
    <p class="path" id="sel-path"></p>
    <p class="lede" id="sel-blurb"></p>
    <div class="meter"><i id="meter-fill"></i></div>
    <div class="row"><span id="meter-label"></span><span id="cap-label"></span></div>
    <p class="next" id="next-name"></p>
    <ul class="list" id="band-list"></ul>
    <div class="actions">
      <button class="gold" data-act="buy">Buy</button>
      <button data-act="sell">Sell</button>
      <button class="ghost" data-act="nock" data-nock>Nock</button>
      <button data-act="refresh">Refresh</button>
    </div>
  </aside>
</div>

<footer>QUIVER sandbox. Shafts are memes with a quarry. Same nock for a person or an agent.</footer>
<script src="data.js"></script><script src="site.js"></script>
</body></html>
